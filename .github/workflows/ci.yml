name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  TESTING: "True"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Lint — ruff + mypy
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff check
        run: ruff check src/ tests/ scripts/ eval/

      - name: Run ruff format check
        run: ruff format --check src/ tests/ scripts/ eval/

      - name: Run mypy
        run: mypy src/ --ignore-missing-imports --no-error-summary

  # ─────────────────────────────────────────────────────────────────────────────
  # Test — pytest with coverage
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            -m "not slow and not integration and not e2e" \
            --cov=src \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=term-missing \
            --junitxml=junit-unit.xml

      - name: Run integration tests
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            -m "integration" \
            --cov=src \
            --cov-append \
            --cov-report=xml:coverage-integration.xml \
            --cov-report=term-missing \
            --junitxml=junit-integration.xml

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: coverage-unit.xml,coverage-integration.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            junit-unit.xml
            junit-integration.xml
            coverage-unit.xml
            coverage-integration.xml

  # ─────────────────────────────────────────────────────────────────────────────
  # Eval — 100-ticket harness against the labeled fixture
  # ─────────────────────────────────────────────────────────────────────────────
  eval:
    name: Evaluation
    runs-on: ubuntu-latest
    needs: test
    env:
      # The harness runs the REAL agent (classifier + drafter need an LLM).
      # Configure this secret in the repo to enable the model-backed eval run.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate checked-in fixture (100 tickets, valid labels)
        run: python -m eval.build_fixture --check

      - name: Run evaluation harness
        id: eval
        if: env.GEMINI_API_KEY != ''
        run: python -m eval.run_eval --source all

      - name: Skip model-backed evaluation (no GEMINI_API_KEY configured)
        if: env.GEMINI_API_KEY == ''
        run: |
          echo "::warning::GEMINI_API_KEY not configured — skipping the 100-ticket model-backed evaluation. Set it as a repo secret to enable CI accuracy gates."

      - name: Enforce accuracy thresholds
        if: success() && env.GEMINI_API_KEY != ''
        run: |
          python - <<'EOF'
          import json
          report = json.load(open('eval/results/latest.json', encoding='utf-8'))
          m = report['metrics']
          cat = m['category_accuracy']
          esc_prec = m['escalation_precision']
          print(f'category_accuracy   = {cat:.3f} (threshold 0.70)')
          print(f'escalation_precision = {esc_prec:.3f} (threshold 0.60)')
          failures = []
          if cat < 0.70:
              failures.append(f'category_accuracy {cat:.3f} < 0.70')
          if esc_prec < 0.60:
              failures.append(f'escalation_precision {esc_prec:.3f} < 0.60')
          if failures:
              for f in failures:
                  print(f'FAIL: {f}')
              raise SystemExit(1)
          print('PASS: all evaluation thresholds met.')
          EOF

      - name: Upload evaluation report
        if: success() && env.GEMINI_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            eval/results/latest.json
            eval/results/report.html

  # ─────────────────────────────────────────────────────────────────────────────
  # Build — Docker image (optional, on main only)
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, eval]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max