name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  TESTING: "True"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Lint — ruff + mypy
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff check
        run: ruff check src/ tests/ scripts/

      - name: Run ruff format check
        run: ruff format --check src/ tests/ scripts/

      - name: Run mypy
        run: mypy src/ --ignore-missing-imports --no-error-summary

  # ─────────────────────────────────────────────────────────────────────────────
  # Test — pytest with coverage
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            -m "not slow and not integration and not e2e" \
            --cov=src \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=term-missing \
            --junitxml=junit-unit.xml

      - name: Run integration tests
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            -m "integration" \
            --cov=src \
            --cov-append \
            --cov-report=xml:coverage-integration.xml \
            --cov-report=term-missing \
            --junitxml=junit-integration.xml

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: coverage-unit.xml,coverage-integration.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            junit-unit.xml
            junit-integration.xml
            coverage-unit.xml
            coverage-integration.xml

  # ─────────────────────────────────────────────────────────────────────────────
  # Eval — evaluation harness on labeled tickets
  # ─────────────────────────────────────────────────────────────────────────────
  eval:
    name: Evaluation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify eval module importable
        run: python -c "from src.eval.harness import EvalHarness; print('OK')"

      - name: Run evaluation harness
        id: eval
        run: |
          python -c "
          import asyncio, json, sys
          from src.eval.harness import EvalHarness

          async def run():
              harness = EvalHarness(concurrency=5)
              metrics = await harness.evaluate()
              report = metrics.to_dict()

              # Write summary for downstream steps
              with open('eval_summary.json', 'w') as f:
                  json.dump(report, f, indent=2)

              # Print key metrics
              print(f'Category Accuracy:    {metrics.category_accuracy:.1%}')
              print(f'Urgency Accuracy:     {metrics.urgency_accuracy:.1%}')
              print(f'Escalation Accuracy:  {metrics.escalation_accuracy:.1%}')
              print(f'Pass Rate:            {metrics.pass_rate:.1%}')

              # Fail if success_rate < 80%
              if metrics.pass_rate < 0.80:
                  print(f'FAIL: success_rate {metrics.pass_rate:.1%} < 80%')
                  sys.exit(1)

              # Fail if escalation_rate > 30%
              total = metrics.total
              escalated = metrics.confusion_matrix.get('escalation', {}).get('TP', 0) + \
                          metrics.confusion_matrix.get('escalation', {}).get('FP', 0)
              escalation_rate = escalated / total if total > 0 else 0
              print(f'Escalation Rate:      {escalation_rate:.1%}')
              if escalation_rate > 0.30:
                  print(f'FAIL: escalation_rate {escalation_rate:.1%} > 30%')
                  sys.exit(1)

              print('PASS: All evaluation thresholds met.')

          asyncio.run(run())
          "

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            eval_summary.json
            eval_report.json
            eval_dashboard.html

  # ─────────────────────────────────────────────────────────────────────────────
  # Build — Docker image (optional, on main only)
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, eval]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
